[project]
name = "turnstile-processing"
version = "0.1.0"
description = "Document processing runtime for the Thaarei Document Management System"
authors = [{ name = "Thaarei" }]
license = "LicenseRef-Thaarei-Proprietary"
license-files = ["LICENSE"]
classifiers = ["Private :: Do Not Upload"]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = []

[project.scripts]
turnstile-processing = "turnstile_processing:main"

[build-system]
requires = ["uv_build==0.13.6"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.mypy]
python_version = "3.13"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
