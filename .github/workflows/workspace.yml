name: Workspace

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  dms-standalone:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@12.16.1
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.13.6"
          python-version: "3.13.18"
      - run: pnpm install --frozen-lockfile
      - name: Install standalone browser test runtime
        run: pnpm exec playwright install --with-deps chromium
      - run: docker build -f apps/dms-api/Dockerfile -t thaarei-dms-api:ci .
      - name: Independent DMS authority database lane
        run: pnpm test:dms:standalone
        env:
          DMS_STANDALONE_IMAGE: thaarei-dms-api:ci

  checks:
    runs-on: ubuntu-24.04
    # Browser downloads can consume eight minutes before the serial database lane.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up supported Docker Compose
        uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2
        with:
          version: v5.6.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@12.16.1
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.13.6"
          python-version: "3.13.18"
      - run: pnpm install --frozen-lockfile
      - name: Install Linux parser sandbox test runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          # This disposable runner must permit the real unprivileged namespace sandbox.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-all --ro-bind / / -- /usr/bin/true
      - name: Install storage browser test runtime
        run: pnpm exec playwright install --with-deps chromium
      - run: uv sync --locked --project apps/dms-processing
      - run: pnpm check
      - run: pnpm build
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm test:smoke
      - run: docker compose --env-file .env.example config --quiet
      - run: docker compose -f deploy/compose.dokploy.yaml config --quiet

  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: dms-api
            dockerfile: apps/dms-api/Dockerfile
          - image: turnstile-api
            dockerfile: apps/turnstile-api/Dockerfile
          - image: turnstile-web
            dockerfile: apps/turnstile-web/Dockerfile
          - image: dms-processing
            dockerfile: apps/dms-processing/Dockerfile
          - image: development
            dockerfile: deploy/Dockerfile.dev
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build application image
        run: docker build -f ${{ matrix.dockerfile }} -t turnstile-workspace/${{ matrix.image }}:ci .
