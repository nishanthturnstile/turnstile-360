name: turnstile-local

services:
  mailpit:
    image: axllent/mailpit:v1.33.0@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    environment:
      MP_MAX_MESSAGES: "200"
      MP_MAX_AGE: 24h
      MP_DISABLE_VERSION_CHECK: "true"
      MP_QUIET: "true"
      MP_MAX_MESSAGE_SIZE: "1"
    ports:
      - 127.0.0.1:23604:1025
      - 127.0.0.1:23605:8025
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    environment:
      POSTGRES_USER: workspace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
      POSTGRES_DB: postgres
    ports:
      - 127.0.0.1:23603:5432
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U workspace -d postgres]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.3.7-management-alpine@sha256:1528a88eebf2bc4d0ab7e9d5d9bc542e9bdf5e1b105e65848fcf8de5c2186528
    environment:
      RABBITMQ_DEFAULT_USER: workspace
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in the root .env}
      RABBITMQ_DEFAULT_VHOST: dms
    ports:
      - 127.0.0.1:23606:5672
      - 127.0.0.1:23607:15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 10s
      timeout: 10s
      retries: 5

  seaweedfs:
    image: chrislusf/seaweedfs:4.51@sha256:f7a49e3f3972ebed5be2ed4befa4a0c68eb7bdddba6e692d42729ceb545134b8
    command: [mini, -dir=/data]
    ports:
      - 127.0.0.1:23608:8333
    volumes:
      - seaweedfs-data:/data

volumes:
  postgres-data:
  rabbitmq-data:
  seaweedfs-data:
