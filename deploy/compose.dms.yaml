name: thaarei-dms

# Foundation profile only. Dokploy routes the canonical HTTPS authority and /v1
# directly to dms-api:3001. SMTP is an operator-configured TLS relay.
services:
  postgres:
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    environment:
      POSTGRES_USER: workspace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a new standalone database password}
      POSTGRES_DB: dms
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U workspace -d dms]
      interval: 10s
      timeout: 5s
      retries: 5
  dms-api:
    image: thaarei-dms-foundation:local
    build:
      context: ..
      dockerfile: apps/dms-api/Dockerfile
    env_file: [{ path: ../.env.dms, format: raw }]
    environment:
      AUTH_MODE: standalone
      AUTH_PROFILE: production
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3001/health/ready/auth').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
volumes:
  postgres-data:
