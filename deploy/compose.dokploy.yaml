name: turnstile-workspace

# Turnstile 360 and DMS application services. Stateful services and processing
# roles are added as their capabilities are implemented.
services:
  dms-api:
    build:
      context: ..
      dockerfile: apps/dms-api/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: "3001"
      AUTH_PROFILE: ${AUTH_PROFILE:-production}
      AUTH_PUBLIC_ORIGIN: ${AUTH_PUBLIC_ORIGIN:-}
      AUTH_ISSUER_URL: ${AUTH_ISSUER_URL:-}
      AUTH_LOGIN_CALLBACK_URL: ${AUTH_LOGIN_CALLBACK_URL:-}
      AUTH_LOGIN_CLIENT_ID: ${AUTH_LOGIN_CLIENT_ID:-}
      DMS_MACHINE_CLIENT_ID: ${DMS_MACHINE_CLIENT_ID:-}
      INSTALLATION_TENANT_ID: ${INSTALLATION_TENANT_ID:-}
      INSTALLATION_CUSTOMER_KEY: ${INSTALLATION_CUSTOMER_KEY:-}
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_DATABASE_URL: ${AUTH_DATABASE_URL:-}
      DMS_DATABASE_URL: ${DMS_DATABASE_URL:-}
      DMS_RESOURCE_URL: ${DMS_RESOURCE_URL:-}
      AUTH_SIGNING_ALGORITHM: ${AUTH_SIGNING_ALGORITHM:-RS256}
      AUTH_DATABASE_POOL_MAX: ${AUTH_DATABASE_POOL_MAX:-5}
      AUTH_SMTP_HOST: ${AUTH_SMTP_HOST:-}
      AUTH_SMTP_PORT: ${AUTH_SMTP_PORT:-587}
      AUTH_SMTP_MODE: ${AUTH_SMTP_MODE:-starttls}
      AUTH_SMTP_USER: ${AUTH_SMTP_USER:-}
      AUTH_SMTP_PASSWORD: ${AUTH_SMTP_PASSWORD:-}
      AUTH_MAIL_FROM: ${AUTH_MAIL_FROM:-}
    expose: ["3001"]
    restart: unless-stopped
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3001/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3

  turnstile-api:
    build:
      context: ..
      dockerfile: apps/turnstile-api/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: "3002"
      AUTH_PROFILE: ${AUTH_PROFILE:-production}
      AUTH_PUBLIC_ORIGIN: ${AUTH_PUBLIC_ORIGIN:-}
      AUTH_ISSUER_URL: ${AUTH_ISSUER_URL:-}
      AUTH_LOGIN_CALLBACK_URL: ${AUTH_LOGIN_CALLBACK_URL:-}
      AUTH_LOGIN_CLIENT_ID: ${AUTH_LOGIN_CLIENT_ID:-}
      DMS_MACHINE_CLIENT_ID: ${DMS_MACHINE_CLIENT_ID:-}
      INSTALLATION_TENANT_ID: ${INSTALLATION_TENANT_ID:-}
      INSTALLATION_CUSTOMER_KEY: ${INSTALLATION_CUSTOMER_KEY:-}
      AUTH_LOGIN_CLIENT_SECRET: ${AUTH_LOGIN_CLIENT_SECRET:-}
      DMS_MACHINE_CLIENT_SECRET: ${DMS_MACHINE_CLIENT_SECRET:-}
      DMS_RESOURCE_URL: ${DMS_RESOURCE_URL:-}
      DMS_API_URL: ${DMS_API_URL:-}
      TURNSTILE_DATABASE_URL: ${TURNSTILE_DATABASE_URL:-}
      TURNSTILE_COOKIE_SECRET: ${TURNSTILE_COOKIE_SECRET:-}
      TURNSTILE_TOKEN_ENCRYPTION_KEY: ${TURNSTILE_TOKEN_ENCRYPTION_KEY:-}
      TURNSTILE_DATABASE_POOL_MAX: ${TURNSTILE_DATABASE_POOL_MAX:-5}
      TURNSTILE_APPLICATION_ID: ${TURNSTILE_APPLICATION_ID:-}
    expose: ["3002"]
    restart: unless-stopped
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3002/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3

  turnstile-web:
    build:
      context: ..
      dockerfile: apps/turnstile-web/Dockerfile
    expose: ["8080"]
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/health/live]
      interval: 15s
      timeout: 5s
      retries: 3
