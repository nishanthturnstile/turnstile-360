pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  # URLs can contain recovery tokens or signed authorization state.
  log_format safe '$remote_addr [$time_local] "$request_method" $status $body_bytes_sent';
  access_log /dev/stdout safe;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; font-src 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'; form-action 'self'" always;

    location ~ ^/(sign-in|forgot-password|reset-password|session-expired|unauthorized|auth-unavailable)$ {
      access_log off;
      error_log /dev/null;
      try_files /index.html =404;
    }

    location = /health/live {
      access_log off;
      default_type text/plain;
      return 200 'ok';
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
